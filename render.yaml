services:
  - type: web
    name: ai-mystery-room-api
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev --prefix server && npm run build --prefix server
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: GENERATION_PROVIDER
        value: gemini
      - key: AI_GENERATION_ENABLED
        value: "true"
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: MAX_GENERATIONS_PER_GUEST_PER_DAY
        value: "3"
      - key: MAX_GENERATIONS_PER_DAY
        value: "30"
